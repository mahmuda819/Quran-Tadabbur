<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Tadabbur — Personal Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
.dashboard-wrap{max-width:1100px;margin:0 auto;padding:42px 6% 80px}.dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.dashboard-head h2{margin:0 0 6px}.dashboard-head p{margin:0;color:var(--muted);line-height:1.6}.dashboard-actions{display:flex;gap:8px}.dashboard-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:600}.dashboard-btn:hover{border-color:var(--accent);color:var(--accent)}.feedback-list{display:grid;gap:14px}.feedback-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.feedback-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:12px}.feedback-email{font-weight:700;color:var(--ink)}.feedback-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.dashboard-status{padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--muted);line-height:1.6}.dashboard-empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:600px){.dashboard-wrap{padding:28px 16px 60px}.dashboard-head{display:block}.dashboard-actions{margin-top:14px}.dashboard-btn{flex:1}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-main"><div class="brand"><div class="brand-mark">ق</div><div><h1>Quran Tadabbur</h1></div></div></div></header>
<main class="dashboard-wrap">
  <div class="dashboard-head"><div><h2>Personal Dashboard</h2><p>Opinion and Dua submissions from new account sign-ups.</p></div><div class="dashboard-actions"><button class="dashboard-btn" id="refreshBtn">Refresh</button><button class="dashboard-btn" id="homeBtn">Home</button></div></div>
  <div id="status" class="dashboard-status">Checking access...</div>
  <div id="list" class="feedback-list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const supabaseConfig=window.SUPABASE_CONFIG||{};
const client=(window.supabase&&supabaseConfig.url&&supabaseConfig.publishableKey)?window.supabase.createClient(supabaseConfig.url,supabaseConfig.publishableKey):null;
const statusEl=document.getElementById('status'), listEl=document.getElementById('list');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
async function load(){
  if(!client){statusEl.textContent='Supabase configuration is missing.';return;}
  const {data:{session}}=await client.auth.getSession();
  const user=session?.user;
  if(!user){statusEl.textContent='Access denied. Please log in as the administrator.';return;}
  if(user.app_metadata?.role!=='admin'){statusEl.textContent='Access denied. This page is only for the personal administrator account.';return;}
  statusEl.textContent='Loading submissions...';
  const {data,error}=await client.from('user_feedback').select('id,email,feedback,created_at').order('created_at',{ascending:false});
  if(error){statusEl.textContent='Unable to load submissions: '+error.message;return;}
  if(!data?.length){statusEl.textContent='No opinion or dua submissions yet.';listEl.innerHTML='';return;}
  statusEl.textContent=data.length+' submission'+(data.length===1?'':'s');
  listEl.innerHTML=data.map(item=>`<article class="feedback-card"><div class="feedback-meta"><span class="feedback-email">${esc(item.email||'')}</span><span>${esc(new Date(item.created_at).toLocaleString())}</span></div><div class="feedback-text">${esc(item.feedback)}</div></article>`).join('');
}
document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('homeBtn').addEventListener('click',()=>{window.location.href='index.html';});
load();
</script>
</body>
</html>
