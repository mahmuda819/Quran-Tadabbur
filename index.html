<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Tadabbur</title>
  <meta name="description" content="Zati Quran Tadabbur Notes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">ق</div>
      <div>
        <h1>Quran Tadabbur</h1>
        <p>Mere Tadabbur Notes</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="auth-btn" id="authBtn" type="button">Login</button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dark mode on">☾</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
      <h2>Quran ke saath gehri soch ka safar</h2>
      <p>Har din ek ayat. Ek soch. Ek tadabbur.</p>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Surah ka naam dhoondhein..." aria-label="Surah ka naam dhoondhein">
      </div>
    </section>

    <section class="surah-grid" id="surahGrid"></section>
  </main>

  <footer>
    <p>Quran Tadabbur • Zati notes ke liye</p>
  </footer>

  <div class="modal hidden" id="authModal" aria-hidden="true">
    <div class="modal-card auth-card">
      <button class="close" id="authClose" type="button" aria-label="Close">×</button>
      <h3 id="authTitle">Login</h3>
      <p class="modal-note" id="authNote">Log in to sync your Tadabbur notes across all your devices.</p>
      <form id="authForm">
        <label class="auth-label" for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com">
        <label class="auth-label" for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="Minimum 6 characters">
        <button class="auth-submit" id="authSubmit" type="submit">Login</button>
      </form>
      <button class="auth-switch" id="authSwitch" type="button">Don't have an account? Sign up</button>
      <button class="auth-logout hidden" id="authLogout" type="button">Logout</button>
      <p class="auth-status" id="authStatus" role="status"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
